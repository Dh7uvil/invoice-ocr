{% extends "admin/change_form.html" %}
{% load static %}

{% block extrahead %}
{{ block.super }}
<style>
    .file-upload-area {
        border: 2px dashed #007cba;
        border-radius: 8px;
        padding: 30px;
        text-align: center;
        background: #f8f9fa;
        margin: 20px 0;
        transition: all 0.3s ease;
    }
    
    .file-upload-area:hover {
        border-color: #005a87;
        background: #e3f2fd;
    }
    
    .file-upload-area.dragover {
        border-color: #28a745;
        background: #d4edda;
    }
    
    .upload-icon {
        font-size: 48px;
        color: #007cba;
        margin-bottom: 15px;
    }
    
    .upload-text {
        font-size: 16px;
        color: #495057;
        margin-bottom: 10px;
    }
    
    .upload-hint {
        font-size: 14px;
        color: #6c757d;
    }
    
    .file-info-display {
        margin-top: 20px;
        padding: 15px;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        border-radius: 8px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        display: none;
    }
    
    .file-info-display h4 {
        margin: 0 0 10px 0;
        color: white;
        font-size: 16px;
    }
    
    .file-info-display p {
        margin: 5px 0;
        font-size: 14px;
    }
    
    .processing-config {
        background: #f8f9fa;
        border: 1px solid #dee2e6;
        border-radius: 8px;
        padding: 20px;
        margin: 20px 0;
    }
    
    .config-title {
        font-size: 18px;
        font-weight: bold;
        color: #495057;
        margin-bottom: 15px;
    }
    
    .config-row {
        display: flex;
        gap: 20px;
        margin-bottom: 15px;
    }
    
    .config-field {
        flex: 1;
    }
    
    .config-field label {
        display: block;
        font-weight: bold;
        margin-bottom: 5px;
        color: #495057;
    }
    
    .config-field select {
        width: 100%;
        padding: 8px 12px;
        border: 1px solid #ced4da;
        border-radius: 4px;
        background: white;
    }
    
    .recommendation {
        background: #d1ecf1;
        border: 1px solid #bee5eb;
        border-radius: 4px;
        padding: 10px;
        margin-top: 10px;
        font-size: 14px;
        color: #0c5460;
    }
</style>
{% endblock %}

{% block content %}
{{ block.super }}

<script>
document.addEventListener('DOMContentLoaded', function() {
    // Drag-and-drop file upload
    const fileInput = document.querySelector('input[type="file"]');
    const uploadArea = document.createElement('div');
    uploadArea.className = 'file-upload-area';
    uploadArea.innerHTML = `
        <div class="upload-icon">📄</div>
        <div class="upload-text">Click to select a file or drag and drop here</div>
        <div class="upload-hint">Supports PDF, JPG, PNG, TIFF, BMP formats, max 10MB</div>
    `;
    
    // Insert upload area
    if (fileInput) {
        fileInput.parentNode.insertBefore(uploadArea, fileInput);
        fileInput.style.display = 'none';
        
        // Click upload area to trigger file selection
        uploadArea.addEventListener('click', () => fileInput.click());
        
        // Drag handling
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });
        
        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });
        
        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                fileInput.files = files;
                handleFileSelect(files[0]);
            }
        });
        
        // File selection handling
        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                handleFileSelect(e.target.files[0]);
            }
        });
    }
    
    function handleFileSelect(file) {
        // Validate file
        const allowedTypes = ['application/pdf', 'image/jpeg', 'image/png', 'image/tiff', 'image/bmp'];
        const maxSize = 10 * 1024 * 1024; // 10MB
        
        if (!allowedTypes.includes(file.type)) {
            alert('Unsupported file format. Please select a PDF, JPG, PNG, TIFF, or BMP file.');
            return;
        }
        
        if (file.size > maxSize) {
            alert('File size cannot exceed 10MB.');
            return;
        }
        
        // Show file info
        showFileInfo(file);
        
        // Auto-fill fields
        document.getElementById('id_file_name').value = file.name;
        document.getElementById('id_file_path').value = 'media/invoices/' + file.name;
        document.getElementById('id_file_size').value = file.size;
        
        // Update upload area display
        uploadArea.innerHTML = `
            <div class="upload-icon">✅</div>
            <div class="upload-text">File selected: ${file.name}</div>
            <div class="upload-hint">Click to select a different file</div>
        `;
    }
    
    function showFileInfo(file) {
        // Create file info display
        let infoDisplay = document.querySelector('.file-info-display');
        if (!infoDisplay) {
            infoDisplay = document.createElement('div');
            infoDisplay.className = 'file-info-display';
            uploadArea.parentNode.insertBefore(infoDisplay, uploadArea.nextSibling);
        }
        
        infoDisplay.innerHTML = `
            <h4>📄 File Information</h4>
            <p><strong>File name:</strong> ${file.name}</p>
            <p><strong>File size:</strong> ${formatFileSize(file.size)}</p>
            <p><strong>File type:</strong> ${file.type}</p>
            <p><strong>Last modified:</strong> ${new Date(file.lastModified).toLocaleString()}</p>
        `;
        infoDisplay.style.display = 'block';
    }
    
    function formatFileSize(bytes) {
        if (bytes === 0) return '0 Bytes';
        const k = 1024;
        const sizes = ['Bytes', 'KB', 'MB', 'GB'];
        const i = Math.floor(Math.log(bytes) / Math.log(k));
        return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
    }
    
    // Processing configuration suggestions
    const ocrEngine = document.querySelector('select[name="ocr_engine"]');
    const llmProvider = document.querySelector('select[name="llm_provider"]');
    
    if (ocrEngine && llmProvider) {
        ocrEngine.addEventListener('change', function() {
            const engine = this.value;
            let recommendation = '';
            
            switch(engine) {
                case 'google_document_ai':
                    llmProvider.value = 'google';
                    recommendation = 'Recommended: use Google Gemini for structured parsing';
                    break;
                case 'aws_textract':
                    llmProvider.value = 'aws';
                    recommendation = 'Recommended: use AWS Bedrock for structured parsing';
                    break;
                case 'paddleocr':
                    llmProvider.value = 'openai';
                    recommendation = 'Recommended: use OpenAI GPT for structured parsing';
                    break;
                default:
                    llmProvider.value = 'openai';
                    recommendation = 'Recommended: use OpenAI GPT for structured parsing';
            }
            
            // Show recommendation
            showRecommendation(recommendation);
        });
    }
    
    function showRecommendation(text) {
        let recDiv = document.querySelector('.recommendation');
        if (!recDiv) {
            recDiv = document.createElement('div');
            recDiv.className = 'recommendation';
            llmProvider.parentNode.appendChild(recDiv);
        }
        recDiv.textContent = text;
    }
});
</script>
{% endblock %}
